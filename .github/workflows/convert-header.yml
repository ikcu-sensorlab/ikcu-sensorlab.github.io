# One-time job: converts the uploaded header PNG to an optimized WebP with a clean file name.
# Runs once when this file is pushed. Safe to delete afterwards.
name: One-time header image conversion
on:
  push:
    branches: [main]
    paths: [.github/workflows/convert-header.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert PNG to WebP
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          src = glob.glob("assets/img/ChatGPT*.png")[0]
          im = Image.open(src).convert("RGB")
          w = 1800
          im = im.resize((w, round(im.height * w / im.width)), Image.LANCZOS)
          im.save("assets/img/lab-header.webp", "WEBP", quality=78, method=6)
          print(src)
          PY
          git rm -q assets/img/ChatGPT*.png
          git add assets/img/lab-header.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Convert header image to optimized WebP" \
            -m "Replaces the uploaded 2.9 MB PNG (file name with spaces and Turkish characters) with assets/img/lab-header.webp: 1800 px wide, WebP quality 78, about 140 KB. Smaller file means a faster home page."
          git push
