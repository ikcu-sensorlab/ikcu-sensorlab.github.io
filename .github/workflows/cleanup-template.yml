# One-time job: removes the al-folio demo content that is not related to the lab.
# It runs once when this file is pushed. Safe to delete this file afterwards.
name: One-time template cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-template.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove demo pages, posts, collections and images
        run: |
          git rm -r --ignore-unmatch -q \
            _pages/about_einstein.md _pages/blog.md _pages/repositories.md _pages/teaching.md \
            _pages/cv.md _pages/books.md _pages/dropdown.md _pages/plugins.md _pages/news.md \
            _posts _news _projects _teachings _books \
            assets/img/1.jpg assets/img/2.jpg assets/img/3.jpg assets/img/4.jpg assets/img/5.jpg assets/img/6.jpg \
            assets/img/7.jpg assets/img/8.jpg assets/img/9.jpg assets/img/10.jpg assets/img/11.jpg assets/img/12.jpg \
            assets/img/prof_pic.jpg assets/img/prof_pic_color.png assets/img/rhino.png \
            assets/img/book_covers assets/img/publication_preview \
            assets/audio assets/video assets/jupyter assets/plotly assets/html
          printf '%% BibTeX file kept for the theme. Lab publications are edited in _pages/publications.md\n' > _bibliography/papers.bib
          git add _bibliography/papers.bib
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Remove al-folio demo content not related to the lab" \
            -m "Deletes the template's example pages (about_einstein, blog, repositories, teaching, CV, books, submenus, plugins, news), demo collections (_posts, _news, _projects, _teachings, _books), demo images (Einstein photos, sample jpgs, book covers, publication previews) and demo media folders (audio, video, jupyter, plotly, html). Empties _bibliography/papers.bib, which only held Einstein's papers."
          git push
